# Hyper-parameter overrides for the small model (better recall on distant smoke).
# Usage: python training/train.py --model yolo11s --config training/configs/yolo11s.yaml
#
# Every key below is passed straight through to ultralytics YOLO.train().

epochs: 150
imgsz: 768
batch: 12
patience: 30
optimizer: AdamW
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 5.0
cos_lr: true

# Loss weights
box: 7.5
cls: 0.5
dfl: 1.5

# Augmentation
hsv_h: 0.010
hsv_s: 0.70
hsv_v: 0.40
degrees: 0.0
translate: 0.10
scale: 0.60
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.10
copy_paste: 0.0
close_mosaic: 15

# Runtime
workers: 8
seed: 0
deterministic: true
amp: true
